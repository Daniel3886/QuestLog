name: CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.app }} validation
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            build: npm run build
            test: npm run test -- --passWithNoTests
          - app: frontend
            build: npm run build -- --webpack
            test: npm run test --if-present

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Check lockfile and install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: ${{ matrix.test }}

      - name: Build
        run: ${{ matrix.build }}
